name: Master Push - Build & Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    uses: ycggggoo/.github/.github/workflows/docker-build-push.yml@master
    with:
      image-name: ycggggoo/xingyun-api
      dockerfile: deploy/Dockerfile.api
      context: .
      java-version: '21'
      maven-module: xingyun-api
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  deploy:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            IMAGE=ghcr.io/ycggggoo/xingyun-api
            TAG=${{ github.sha }}
            DIR=/data/xingyun-erp

            echo "=== Pull image: ${IMAGE}:${TAG} ==="
            docker pull ${IMAGE}:${TAG}

            echo "=== Tag as :local ==="
            docker tag ${IMAGE}:${TAG} ${IMAGE}:local

            echo "=== Redeploy ==="
            cd ${DIR}
            docker compose -f docker-compose.app.yml up -d --force-recreate xingyun-api

            echo "=== Health check ==="
            for i in 1 2 3 4 5 6 7 8; do
              if docker exec xingyun-api curl -sf -m 5 http://localhost:8080/actuator/health; then
                echo "OK"
                exit 0
              fi
              echo "Waiting... ($i/8)"
              sleep 15
            done
            echo "FAILED"
            exit 1
